security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_users:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # One firewall for the whole site. The back office is no longer a login
        # of its own: staff are ordinary accounts carrying ROLE_ADMIN, and the
        # access_control rules below are what keep everyone else out of /admin.
        main:
            lazy: true
            provider: app_users
            entry_point: form_login
            form_login:
                # Route names rather than paths. Every page here sits behind a
                # /{_locale} prefix, and the router fills that in from the
                # current request - falling back to the default locale under
                # /admin, which carries no locale of its own.
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_account
            logout:
                path: app_logout
                target: home

    # Note: only the first matching rule is applied.
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: '^/(en|lv|ru)/account', roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Hashing is resource-intensive by design; tests do not need the cost.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
