security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # PLACEHOLDER (M1). Real accounts, a User entity and roles arrive in M3;
        # this exists only so the back office is not reachable without a password.
        admin_users:
            memory:
                users:
                    admin:
                        password: '%env(ADMIN_PASSWORD_HASH)%'
                        roles: ['ROLE_ADMIN']

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        admin:
            pattern: ^/admin
            provider: admin_users
            http_basic:
                realm: 'SPEKS admin'
            # EasyAdmin always renders a sign-out link, so the firewall needs a
            # logout route. Under HTTP basic the browser re-sends credentials
            # straight away, so this only truly logs out once M3 replaces this
            # firewall with a form login.
            logout:
                path: /admin/logout
                target: /

        main:
            lazy: true
            provider: admin_users

    # Note: only the first matching rule is applied.
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Hashing is resource-intensive by design; tests do not need the cost.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
