# Enable stateless CSRF protection for forms and logins/logouts
framework:
    form:
        csrf_protection:
            token_id: submit

    csrf_protection:
        stateless_token_ids:
            - submit
            - authenticate
            - logout
            # The buy button on /{_locale}/memberships. Hand-written rather than
            # a form type, so it carries its own token id.
            - checkout
            # Adding to, updating and emptying the basket. Separate from
            # "checkout" on purpose: mutating a cart is not handing money to
            # Stripe, and the two should not share a token.
            - cart
