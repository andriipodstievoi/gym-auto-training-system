# Constraint violation messages. The Validator component always translates
# these in the "validators" domain, never in "messages".
register:
    error:
        email_taken: "An account with this email already exists."
        password_mismatch: "The two passwords do not match."
        password_blank: "Please choose a password."
        password_short: "Use at least 8 characters."
        password_weak: "That password is too easy to guess. Try a longer one."

account:
    password:
        error:
            current_wrong: "That is not your current password."
