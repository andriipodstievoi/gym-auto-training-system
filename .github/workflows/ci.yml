name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP · Symfony
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      # Overrides the local default in app/.env for the CI service container.
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/gym_app?serverVersion=8.4.3-mysql&charset=utf8mb4"
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gym_app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, zip, pdo_mysql, redis, apcu, opcache
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('app/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate composer.json
        run: composer validate --strict

      - name: Check code style
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1

      - name: Warm cache (PHPStan reads the compiled container)
        run: bin/console cache:warmup --env=dev

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      - name: Cache Tailwind binary
        uses: actions/cache@v6
        with:
          path: app/var/tailwind
          key: tailwind-v4.3.3-${{ runner.os }}

      - name: Build CSS
        run: bin/console tailwind:build --minify

      - name: Prepare the test database
        run: |
          bin/console doctrine:database:create --env=test --if-not-exists
          bin/console doctrine:migrations:migrate --env=test --no-interaction
          bin/console doctrine:fixtures:load --env=test --no-interaction

      - name: Tests
        run: bin/phpunit --coverage-text --coverage-clover=var/coverage/clover.xml
        env:
          XDEBUG_MODE: coverage

  python:
    name: Python · ai-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest -q

  docker:
    name: Docker · images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build the stack
        run: docker compose -f infra/compose.yaml build

      - name: Validate the compose file
        run: docker compose -f infra/compose.yaml config --quiet
