name: speks-prod

# Production stack.
#
# A separate file rather than an override of compose.yaml, as docs/HOSTING.md
# recommends. The two differ in what exists, what is published and what is
# persisted, and an override chain whose job is to delete a service and unmap
# five ports is harder to read - and easier to get half right - than two files
# that each say what they mean.
#
# The target is the Oracle Cloud Always Free Ampere A1 instance from
# docs/HOSTING.md: 2 OCPU and 12 GB shared by everything, aarch64, Ubuntu LTS.
# The memory limits below are sized for that box and for one small site.
#
#     docker compose -f infra/compose.prod.yaml up -d --build
#
# docs/DEPLOY.md is the whole procedure, including the parts a person has to
# do by hand.

# Every deployment-specific value - APP_SECRET, the database password, the
# domain, whatever mail and Stripe credentials exist - lives in one git-ignored
# file and reaches the containers as a real environment variable. Nothing
# secret is interpolated into this file, which is what keeps this file safe to
# read over somebody's shoulder and safe to commit.
#
# Every service gets the same file. On a single VM they share a trust domain
# anyway, and two files would be two files to keep in step.
#
# SPEKS_ENV_FILE exists so the same stack can be smoke-tested against a
# throwaway file without editing anything here. Production leaves it unset and
# gets deploy/.env.prod. Paths are relative to this file.
x-env-file: &env-file
  - ${SPEKS_ENV_FILE:-deploy/.env.prod}

# Survives a VM reboot and a crash, but not a deliberate "docker compose stop"
# - which is the whole difference between this and "always".
x-restart: &restart unless-stopped

services:
  # The only service reachable from outside the VM.
  caddy:
    image: caddy:2.11-alpine
    restart: *restart
    env_file: *env-file
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      # HTTP/3. Harmless if UDP 443 is not open in the security list; clients
      # fall back to TCP without noticing.
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates, their private keys and the ACME account key. Without a
      # persistent volume every restart is a fresh issuance, and Let's Encrypt
      # allows five duplicate certificates per registered domain per week: a
      # couple of days of restarts and the site has no certificate at all
      # until the window rolls forward.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      # service_started, not service_healthy. nginx's health check asks for a
      # real page, which is a question about the application; TLS termination
      # should come up either way, so that a broken application answers with
      # its own error page rather than with a refused connection. Caddy retries
      # the upstream on its own until it answers.
      nginx:
        condition: service_started
    healthcheck:
      # The admin API is bound to localhost inside the container. Asking it,
      # rather than asking for a page, keeps the check independent of the
      # site's hostname and of whether a certificate has been issued yet.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:1.29-alpine
    restart: *restart
    # No published ports. Caddy reaches this over the compose network and
    # nothing on the host or on the internet can.
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app_public:/var/www/app/public:ro
    depends_on:
      php:
        condition: service_healthy
    healthcheck:
      # A real page through nginx and php-fpm rather than a static file, which
      # is what catches an image built without the AssetMapper step or a front
      # controller that is not reachable - both of which return a perfectly
      # healthy-looking container otherwise. This is the check worth watching
      # after a deploy.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/en"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 128M

  php:
    build:
      context: ..
      dockerfile: infra/php/Dockerfile
    restart: *restart
    env_file: *env-file
    environment:
      # Fixed by the topology, and set here rather than in the env file on
      # purpose: environment wins over env_file, so a stray APP_ENV=dev in a
      # hand-edited file on the VM cannot put the debug toolbar back in front
      # of visitors.
      APP_ENV: prod
      APP_DEBUG: "0"
      REDIS_URL: "redis://redis:6379"
      AI_SERVICE_URL: "http://ai-service:8001"
      # Caddy is the only thing that ever sets X-Forwarded-*, nginx is not
      # published, and neither is this service - so the only peer PHP can
      # possibly see is another container on this network. REMOTE_ADDR trusts
      # that peer; PRIVATE_SUBNETS covers the RFC 1918 range Docker allocates
      # from, whichever one it picks today. Symfony expands both of those
      # strings itself, in Request::setTrustedProxies.
      TRUSTED_PROXIES: "REMOTE_ADDR,PRIVATE_SUBNETS"
    volumes:
      # nginx serves the compiled public/ directory and it has to be the one
      # this image built - AssetMapper digests every filename, so a stale copy
      # is a site with no stylesheet.
      #
      # A named volume is populated from the image exactly once, when Docker
      # creates it. Mounting it over /var/www/app/public the way compose.yaml
      # does is fine for a stack that is built once and thrown away; on a host
      # that gets redeployed it would leave nginx serving whatever assets were
      # compiled the first time, forever. So the image keeps its own public/
      # at the real path and the container refills the shared copy on start.
      - app_public:/srv/public
    command: >-
      sh -c "rm -rf /srv/public/* /srv/public/.[!.]* 2>/dev/null;
      cp -a /var/www/app/public/. /srv/public/ && exec php-fpm"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M

  # Migrations and demo data, on demand and never on the deploy path:
  #
  #     docker compose -f infra/compose.prod.yaml --profile seed run --rm seed
  #
  # Built from the same Dockerfile with the dev dependencies kept, because
  # doctrine-fixtures-bundle is one of them and is registered for dev and test
  # only. It runs once and exits; nothing serves traffic from this image.
  #
  # It purges the database, so it belongs to first provision alone. Migrations
  # on their own are safe to repeat and are run separately - see
  # infra/deploy/provision.sh and docs/DEPLOY.md.
  seed:
    profiles: ["seed"]
    build:
      context: ..
      dockerfile: infra/php/Dockerfile
      args:
        INSTALL_DEV: "1"
    restart: "no"
    env_file: *env-file
    environment:
      APP_ENV: dev
      REDIS_URL: "redis://redis:6379"
      AI_SERVICE_URL: "http://ai-service:8001"
    command: >-
      sh -c "php bin/console doctrine:migrations:migrate --no-interaction
      && php bin/console doctrine:fixtures:load --no-interaction"
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M

  ai-service:
    build:
      context: ../ai-service
    restart: *restart
    env_file: *env-file
    environment:
      AI_HOST: "0.0.0.0"
    # No published port, on purpose. docs/HOSTING.md is explicit that the plan
    # generator must not be publicly routable: it has no authentication of its
    # own and it is the process holding the Anthropic key. Symfony reaches it
    # at http://ai-service:8001 over this network; nothing else can reach it
    # at all.
    deploy:
      resources:
        limits:
          memory: 1024M

  mysql:
    image: mysql:8.4
    restart: *restart
    env_file: *env-file
    command:
      - --mysql-native-password=OFF
      # One small site sharing 12 GB with everything else. The 8.4 default is
      # 128 MB, which would do; the schema is small enough that this holds the
      # whole working set.
      - --innodb-buffer-pool-size=256M
    # No published port. On the dev stack 3307 is a convenience; here it would
    # be an open MySQL on a public IP.
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # MYSQL_PWD rather than -p, so the password stays out of the process
      # list inside the container.
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2048M

  redis:
    image: redis:7-alpine
    restart: *restart
    command:
      - redis-server
      # Sessions live here as well as the cache, so losing the dataset on
      # restart would sign every member out. The append-only file is cheap at
      # this size.
      - --appendonly
      - "yes"
      # Far above anything this site will use. allkeys-lru rather than the
      # default noeviction, so that reaching the cap degrades to a cold cache
      # and, at worst, somebody being signed out - rather than to Redis
      # refusing writes and the site returning errors.
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - allkeys-lru
    # No published port either.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M

volumes:
  db_data:
  redis_data:
  caddy_data:
  caddy_config:
  # Refilled from the php image every time the php service starts, which is
  # how a rebuild reaches nginx. See the comment on that volume mount.
  app_public:
