name: speks

# Host ports are deliberately offset so this stack can run alongside a local
# Laragon install (MySQL 3306, Redis 6379, Mailpit 8025) without clashing.

services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # The document root comes from the php image, not from the host. Mounting
      # ../app here served whatever happened to be checked out instead of what
      # was built - including no stylesheet, since AssetMapper compiles it into
      # public/assets during the image build.
      - app_public:/var/www/app/public:ro
    depends_on:
      php:
        condition: service_healthy

  php:
    build:
      context: ..
      dockerfile: infra/php/Dockerfile
    environment:
      # prod, matching the image. Running dev here would have re-enabled the
      # profiler that --no-dev just removed the bundle for.
      APP_ENV: prod
      APP_DEBUG: "0"
      # Override for anything real. The value in app/.env is a development
      # default that has been committed to a public repository since M3, so it
      # must be treated as public knowledge.
      APP_SECRET: "${APP_SECRET:-compose-development-secret-not-for-production}"
      DATABASE_URL: "mysql://gym:gym@mysql:3306/gym_app?serverVersion=8.4.3-mysql&charset=utf8mb4"
      REDIS_URL: "redis://redis:6379"
      MAILER_DSN: "smtp://mailpit:1025"
      AI_SERVICE_URL: "http://ai-service:8001"
      # Empty is a supported state - the site boots and every page renders.
      STRIPE_PUBLIC_KEY: "${STRIPE_PUBLIC_KEY:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
    volumes:
      # Deliberately no bind mount of ../app. It shadowed the vendor directory
      # the Dockerfile installs and the assets it compiles, so a fresh clone
      # came up with neither. Only public/ is shared, and only so nginx can
      # read it.
      - app_public:/var/www/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Migrations and demo data, on demand:
  #
  #     docker compose -f infra/compose.yaml --profile seed run --rm seed
  #
  # Built from the same Dockerfile with the dev dependencies kept, because
  # doctrine-fixtures-bundle is one of them and is registered for dev and test
  # only. It runs once and exits; nothing serves traffic from this image.
  seed:
    profiles: ["seed"]
    build:
      context: ..
      dockerfile: infra/php/Dockerfile
      args:
        INSTALL_DEV: "1"
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://gym:gym@mysql:3306/gym_app?serverVersion=8.4.3-mysql&charset=utf8mb4"
      REDIS_URL: "redis://redis:6379"
      MAILER_DSN: "smtp://mailpit:1025"
      AI_SERVICE_URL: "http://ai-service:8001"
    command: >-
      sh -c "php bin/console doctrine:migrations:migrate --no-interaction
      && php bin/console doctrine:fixtures:load --no-interaction"
    depends_on:
      mysql:
        condition: service_healthy

  ai-service:
    build:
      context: ../ai-service
    ports:
      - "8002:8001"
    environment:
      AI_HOST: "0.0.0.0"

  mysql:
    image: mysql:8.4
    command: --mysql-native-password=OFF
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gym_app
      MYSQL_USER: gym
      MYSQL_PASSWORD: gym
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8026:8025"
      - "1026:1025"

volumes:
  db_data:
  # Populated from the php image the first time it is created, which is how
  # nginx gets the built stylesheet without a bind mount.
  app_public:
