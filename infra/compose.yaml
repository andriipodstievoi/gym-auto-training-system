name: speks

# Host ports are deliberately offset so this stack can run alongside a local
# Laragon install (MySQL 3306, Redis 6379, Mailpit 8025) without clashing.

services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../app:/var/www/app:ro
    depends_on:
      php:
        condition: service_healthy

  php:
    build:
      context: ..
      dockerfile: infra/php/Dockerfile
    environment:
      APP_ENV: dev
      DATABASE_URL: "mysql://gym:gym@mysql:3306/gym_app?serverVersion=8.4.3-mysql&charset=utf8mb4"
      REDIS_URL: "redis://redis:6379"
      MAILER_DSN: "smtp://mailpit:1025"
      AI_SERVICE_URL: "http://ai-service:8001"
    volumes:
      - ../app:/var/www/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    build:
      context: ../ai-service
    ports:
      - "8002:8001"
    environment:
      AI_HOST: "0.0.0.0"

  mysql:
    image: mysql:8.4
    command: --mysql-native-password=OFF
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gym_app
      MYSQL_USER: gym
      MYSQL_PASSWORD: gym
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8026:8025"
      - "1026:1025"

volumes:
  db_data:
